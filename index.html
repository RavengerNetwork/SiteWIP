<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
		<link rel="manifest" href="site.webmanifest">
    <title>Ravenger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000000, #1a1a1a, #0a0a0a, #262626);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            animation: gridPulse 4s ease-in-out infinite;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* Main content container */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        /* Logo container */
        .logo-container {
            position: relative;
            animation: fadeInScale 1.5s ease-out;
        }

        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .logo-wrapper {
            position: relative;
            padding: 40px;
        }

        /* Rotating rings around logo */
        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        .ring-1 {
            width: 300px;
            height: 300px;
            border-top-color: rgba(255, 255, 255, 0.3);
            animation-duration: 15s;
        }

        .ring-2 {
            width: 400px;
            height: 400px;
            border-right-color: rgba(255, 255, 255, 0.2);
            animation-duration: 20s;
            animation-direction: reverse;
        }

        .ring-3 {
            width: 500px;
            height: 500px;
            border-left-color: rgba(255, 255, 255, 0.15);
            animation-duration: 25s;
        }

        @keyframes rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Logo image placeholder */
        .logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.3));
            position: relative;
            z-index: 3;
        }

        /* Glowing effect */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.8;
            }
        }

        /* Scanline effect - Option 1 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: scan 8s linear infinite;
            z-index: 2;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }

        /* Vignette effect - Option 2 */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8);
            z-index: 2;
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo {
                width: 150px;
                height: 150px;
            }

            .ring-1 { width: 250px; height: 250px; }
            .ring-2 { width: 320px; height: 320px; }
            .ring-3 { width: 400px; height: 400px; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="grid-overlay"></div>
    
    <!-- Option 1: Uncomment for a scanning line effect -->
    <!-- <div class="scanline"></div> -->
    
    <!-- Option 2: Uncomment for a vignette (darkened edges) effect -->
    <div class="vignette"></div>

    <div class="container">
        <div class="logo-container">
            <div class="glow"></div>
            <div class="ring ring-1"></div>
            <div class="ring ring-2"></div>
            <div class="ring ring-3"></div>
            <div class="logo-wrapper">
                <!-- Replace the src below with your logo file path -->
                <img src="icon.png" alt="Logo" class="logo" id="logoImg">
            </div>
        </div>
    </div>

    <script>
        // Create floating particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 4 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 20000);
        }

        // Generate particles
        for (let i = 0; i < 30; i++) {
            createParticle();
        }

        setInterval(createParticle, 1000);

        // Handle missing logo gracefully
        const logoImg = document.getElementById('logoImg');
        logoImg.onerror = function() {
            // Create a placeholder if logo doesn't load
            const placeholder = document.createElement('div');
            placeholder.style.cssText = `
                width: 200px;
                height: 200px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 48px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.8);
                letter-spacing: 8px;
                text-transform: uppercase;
            `;
            placeholder.textContent = 'Logo';
            logoImg.replaceWith(placeholder);
        };
    </script>
</body>
</html>
